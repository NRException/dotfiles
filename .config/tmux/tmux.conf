#tpm from https://github.com/tmux-plugins/tpm

#!!! C-t + I (capital I to install plugins) !!!
#!!! C-t + r to source !!!

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'light256' # or 'dark256', 'light', 'light256'
set -g @tmux-gruvbox-statusbar-alpha 'true'
set -g @tmux-gruvbox-left-status-a 'tmux' # tmux's session name`
set -g @tmux-gruvbox-right-status-x '%d/%m/%Y' # e.g.: 01/31/2024
set -g @tmux-gruvbox-right-status-y '%H:%M%p' # 09:54 PM
set -g @tmux-gruvbox-right-status-z '#{pane_current_path}'

# Set misc options...
setw -g pane-base-index 1
set-option -s escape-time 10
set-option -g mouse on
set-option -g base-index 1
set-option -g status-interval 1
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'
set-option -g status-style "bg=default"
set-option -g pane-border-style "bg=default"
set-option -g pane-active-border-style "bg=default"
set-option -g status-position bottom
set-option -g renumber-windows 1

# Change keybindings to be a little less awkward.
set-option -g prefix C-t
unbind ','
unbind 's'
unbind '%'
unbind C-b
bind '\' split-window -h 
bind '-' split-window -v
bind-key C-t send-prefix
bind-key s source-file ~/.config/tmux/tmux.conf
bind-key r command-prompt -I "#W" "rename-window '%%'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
